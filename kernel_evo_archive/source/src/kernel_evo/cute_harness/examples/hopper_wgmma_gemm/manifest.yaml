id: cute_dsl_4_2_hopper_wgmma_gemm
dialect: cute_dsl_python
origin:
  repository: NVIDIA/cutlass
  tag: v4.2.1
  commit: f3fde58372d33e9a5650ba7b80fc48b3b49d40c8
  path: examples/python/CuTeDSL/hopper/dense_gemm.py
  license: BSD-3-Clause
adaptations:
  - Added the locally verified BFloat16 input/output path.
  - Made BF16/Float32 the default dtype contract.
  - Reference GEMM uses decoded, quantized FP8 operand values.
architecture:
  required: sm_90a
operation:
  kind: batched_gemm
  equation: C[m,n,l] = sum_k A[m,k,l] * B[n,k,l]
supported:
  a_dtype: [bf16, fp16, fp8_e4m3fn, fp8_e5m2]
  b_dtype: [bf16, fp16, fp8_e4m3fn, fp8_e5m2]
  c_dtype: [bf16, fp16, fp32, fp8_e4m3fn, fp8_e5m2]
  accumulator_dtype: fp32
  constraints:
    - FP8 operands are K-major and their contiguous extent is a multiple of 16 elements.
    - BF16/FP16 operands use the same input dtype and a contiguous extent multiple of 8 elements.
    - CTA M is 64 or 128; CTA N is 64, 128, or 256.
    - Cluster shapes are 1x1, 2x1, 1x2, or 2x2.
mapping:
  gmem_to_smem: TMA with optional cluster multicast
  smem_to_accumulator: WGMMA
  accumulator: Float32 registers
  epilogue: register conversion, swizzled SMEM, TMA store
  pipeline: PipelineTmaAsync
expected_codegen:
  required_instruction_families: [wgmma, tma, mbarrier]
  forbidden_patterns: [scalar_global_load_mainloop]
correctness:
  reference: torch.einsum over the stored/quantized operand values
  fp8_bf16_output_rtol: 0.01
  boundary_requirements: aligned GEMM domain; add a separate residue path for unsupported ragged K
performance:
  tunables: [tile_shape_mn, cluster_shape_mn, ab_stage, atom_layout_mnk]
  benchmark_excludes: [cute.compile]
