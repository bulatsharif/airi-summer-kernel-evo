schema_version: 1
order_seed: 20260731
model: deepseek/deepseek-v4-flash
task: level2_63_gemm_relu_divide_fp8
tiers: [bare, docs, examples, errors]
agent:
  replications: 1
  # Attempts the agent gets to reach a working kernel. Each attempt is one
  # OpenCode session that sees its own previous candidate and the B300
  # diagnostic, never a reference implementation.
  steps: 6
  islands: 1
  # One arm per process. Arms are isolated from each other by running each in
  # its own git worktree with `--tier`, because `results/` is untracked and so
  # does not exist in a fresh worktree -- a sibling arm's kernel is not on disk
  # to be read. Two arms in one checkout share a path shape that no permission
  # glob can separate: a first attempt at this study had the `bare` arm read
  # `<run>/archive/iter-006-island-0/submission.py` out of the `examples` arm
  # and emit it back byte-identically. Each worktree symlinks `.kernelevo` to
  # the primary checkout so `b300.lock` still serializes device timing.
  concurrency: 1
  max_output_tokens: 8192
  max_repairs_per_island: 0
  # The agent starts from the public skeleton, never from a working kernel.
  # The verified baseline is timed separately as the speedup denominator and
  # is never shown to the model.
  b300_seed: starter
  session_timeout_seconds: 900
evaluator:
  seed: 0
  warmup: 5
  repeats: 50
  timeout_seconds: 900
# E1 is the reference cell of the grid: every knob off. `documentation.delivery`
# is left unset, which is `files` -- the tier is materialized and the author
# opens what it wants. E2 flips it to `prompt`, E3 turns the critic on, E4 turns
# the profiler on; each of those differs from this file by exactly one key.
#
# documentation:
#   delivery: prompt
# profiling:
#   enabled: true
# feedback:
#   critic: true

# Simplest epilogue among the tasks with real headroom: relu then divide, no
# reduction, one required call. DeepSeek has passed this task at `errors` with
# `prompt` delivery (0.1188 ms vs a 0.3830 ms baseline).
