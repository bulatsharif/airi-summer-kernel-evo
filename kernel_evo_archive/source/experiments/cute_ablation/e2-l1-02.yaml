schema_version: 1
order_seed: 20260731
model: deepseek/deepseek-v4-flash
task: level1_02_vector_scale_fp4
tiers: [errors]
agent:
  replications: 1
  # Attempts the agent gets to reach a working kernel. Each attempt is one
  # OpenCode session that sees its own previous candidate and the B300
  # diagnostic, never a reference implementation.
  steps: 6
  islands: 1
  # One arm per process; arms are isolated by running each in its own git
  # worktree. See e1-l2-63.yaml for why a shared checkout leaks kernels.
  concurrency: 1
  max_output_tokens: 8192
  max_repairs_per_island: 0
  b300_seed: starter
  session_timeout_seconds: 900
evaluator:
  seed: 0
  warmup: 5
  repeats: 50
  timeout_seconds: 900
# E2, retrieval. One key differs from e1: how the identical tier bytes reach
# the author. Tier pinned to `errors` rather than selected -- see REPORT.md.
documentation:
  delivery: prompt

# Floor of the difficulty range: the policy requires only `cute.make_tensor`,
# no MMA at all. If the documentation threshold seen on level2_63 disappears
# here, the threshold is a property of the task's difficulty, not of the model.
