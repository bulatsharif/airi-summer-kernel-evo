schema_version: 1
order_seed: 20260731
model: deepseek/deepseek-v4-flash
task: level2_63_gemm_relu_divide_fp8
# Best tier from E1, held fixed.
tiers: [errors]
agent:
  replications: 1
  # Attempts the agent gets to reach a working kernel. Each attempt is one
  # OpenCode session that sees its own previous candidate and the B300
  # diagnostic, never a reference implementation.
  steps: 6
  islands: 1
  concurrency: 1
  max_output_tokens: 8192
  max_repairs_per_island: 0
  # The agent starts from the public skeleton, never from a working kernel.
  # The verified baseline is timed separately as the speedup denominator and
  # is never shown to the model.
  b300_seed: starter
  session_timeout_seconds: 900
evaluator:
  seed: 0
  warmup: 5
  repeats: 50
  timeout_seconds: 900
# E3, feedback. Exactly one key differs from e1-l2-63.yaml: one read-only LLM
# critique of the evaluated candidate leads the next turn's feedback. The critic
# runs on the same model as the author and its tokens are recorded separately in
# each sample as `critic_tokens`, never folded into the author's counts.
feedback:
  critic: true
