[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cute-harness"
version = "0.1.0"
description = "Authenticated CUDA/PyTorch source runner and profiler"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
cute-harness = "cute_harness.app:main"

[tool.setuptools.packages.find]
include = ["cute_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
